# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  
  # Configuración global del ícono
  image_path: "assets/icons/icon_police.png"
  
  ios: true
  remove_alpha_ios: true
  
  web:
    generate: true
    background_color: "#1565C0"
    theme_color: "#1565C0"

  windows:
    generate: true
    icon_size: 48

  macos:
    generate: false