<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Plataforma Ciudadana de Búsqueda y Localización de Personas Desaparecidas en el Perú">
  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alerta Desaparecidos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alerta Desaparecidos - Plataforma Ciudadana</title>
  <link rel="manifest" href="manifest.json">

  <!-- Aceleración de red y pre-conexión de CDNs críticos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://firebasestorage.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0A0F1D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    textarea,
    input,
    .flt-text-editing,
    flt-text-editing-host textarea,
    flt-text-editing-host input,
    flutter-view textarea,
    flutter-view input {
      color: transparent !important;
      -webkit-text-fill-color: transparent !important;
      background: transparent !important;
      background-color: transparent !important;
      caret-color: #2563EB !important;
    }
    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at center, #0F3066 0%, #0A1E3F 45%, #061021 80%, #020710 100%);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.35s ease-out;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .splash-badge-container {
      position: relative;
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }
    .splash-pulse-ring {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      animation: splash-pulse 2s infinite ease-in-out;
    }
    .splash-logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      z-index: 1;
    }
    .splash-title {
      color: #FFFFFF;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .splash-subtitle {
      color: #38BDF8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .splash-progress-track {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }
    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #38BDF8, #2563EB, #06B6D4);
      border-radius: 99px;
      animation: splash-loading 1.3s infinite ease-in-out;
    }
    .splash-status {
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    @keyframes splash-pulse {
      0% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 30px rgba(56, 189, 248, 0.65); }
      100% { transform: scale(0.92); opacity: 0.7; }
    }
    @keyframes splash-loading {
      0% { left: -45%; width: 35%; }
      50% { width: 65%; }
      100% { left: 100%; width: 45%; }
    }
  </style>

  <!-- Soporte diferido para PDFs (pdf.js v3.2.146) sin bloquear el arranque inicial -->
  <script type="text/javascript">
    var _baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
    window.dartPdfJsBaseUrl = _baseUrl + "js/";
    window.dartPdfJsVersion = "3.2.146";
    function initPdfWorker() {
      if (window.pdfjsLib) {
        var _baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = _baseUrl + "js/pdf.worker.min.js";
      }
    }
  </script>
  <script defer src="js/pdf.min.js" onload="initPdfWorker()"></script>
</head>
<body>
  <div id="splash-container">
    <div class="splash-content">
      <div class="splash-badge-container">
        <div class="splash-pulse-ring"></div>
        <img src="icons/Icon-192.png" alt="PNP Alerta" class="splash-logo" onerror="this.style.display='none'">
      </div>
      <div class="splash-title">ALERTA DESAPARECIDOS</div>
      <div class="splash-subtitle">POLICÍA NACIONAL DEL PERÚ</div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-status">Iniciando plataforma segura...</div>
    </div>
  </div>

  <script>
    // --- Escudo de navegación física móvil para Web / PWA ---
    // En navegadores móviles (Chrome Android) y PWA, presionar el botón físico de retroceso
    // dispara el evento popstate del navegador. Para evitar que el navegador cierre la pestaña
    // o salga de la app cuando el usuario retrocede entre pantallas en Flutter,
    // mantenemos un buffer de estado en el historial que permite a Flutter capturar popRoute.
    (function() {
      try {
        if (window.history && window.history.pushState) {
          window.history.pushState({ app: 'pnp_alerta_init' }, '', window.location.href);
          window.addEventListener('popstate', function (event) {
            window.history.pushState({ app: 'pnp_alerta_active' }, '', window.location.href);
          });
        }
      } catch (err) {
        console.warn('⚠️ [PWA] Error inicializando buffer de historial:', err);
      }
    })();

    // --- PWA Installation Bridge ---
    window.pwaDeferredPrompt = null;
    window.pwaInstallAvailable = false;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.pwaInstallAvailable = true;
      console.log('📱 [PWA] Evento beforeinstallprompt capturado y listo para instalar.');
      window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
    });

    window.addEventListener('appinstalled', function () {
      window.pwaDeferredPrompt = null;
      window.pwaInstallAvailable = false;
      console.log('🎉 [PWA] Aplicación instalada exitosamente en el dispositivo.');
      window.dispatchEvent(new CustomEvent('pwa_installed'));
    });

    window.isPWAInstalled = function () {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
             (window.navigator.standalone === true) ||
             (document.referrer && document.referrer.includes('android-app://'));
    };

    window.canPromptPWAInstall = function () {
      return window.pwaDeferredPrompt !== null;
    };

    window.isIOSDevice = function () {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    };

    window.triggerPWAInstallPrompt = function () {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        return window.pwaDeferredPrompt.userChoice.then(function (choiceResult) {
          window.pwaDeferredPrompt = null;
          window.pwaInstallAvailable = false;
          return choiceResult.outcome === 'accepted';
        }).catch(function (err) {
          console.warn('⚠️ [PWA] Error en userChoice:', err);
          return false;
        });
      }
      return Promise.resolve(false);
    };

    // Registro del Service Worker de Firebase Cloud Messaging para Web Push
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('✅ [PWA] Service Worker FCM registrado exitosamente con scope:', registration.scope);
          })
          .catch(function (error) {
            console.warn('⚠️ [PWA] Error registrando Service Worker FCM:', error);
          });
      });
    }

    // Helper global para mostrar notificaciones nativas de escritorio/navegador en primer plano
    window.showWebNotification = function (title, body, iconUrl, caseId) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") {
        try {
          const notification = new Notification(title || "🚨 ALERTA PNP", {
            body: body || "Nueva alerta de persona desaparecida o pista ciudadana.",
            icon: iconUrl || "/icons/Icon-192.png",
            badge: "/favicon.png",
            tag: caseId ? "case_" + caseId : "pnp_general",
            renotify: true
          });
          notification.onclick = function () {
            window.focus();
            notification.close();
            if (caseId) {
              window.dispatchEvent(new CustomEvent('pnp_web_notification_clicked', { detail: { caseId: caseId } }));
            }
          };
        } catch (e) {
          console.warn("⚠️ Error mostrando notificación de escritorio:", e);
        }
      }
    };

    // Remover splash screen una vez que Flutter renderiza su primer marco
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash-container');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          splash.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
